name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check（node --check 全部源码）
        run: npm run check
      - name: Lint（静态安全审计 + 引用完整性）
        run: npm run lint
      - name: Test（全部 *.test.mjs）
        run: npm test
      - name: Build 校验（资源引用 / _headers / 体积）
        run: npm run build

  v2:
    name: v2 · 类型/回归网/构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - name: Install（锁定版本）
        run: npm ci
      - name: Type check（TS strict）
        run: npm run check
      - name: 版本一致性（package.json = CHANGELOG 最新条目 = 设置页注入，A1）
        run: npm run version:check
      - name: 内核回归网（v1↔v2 对拍 + 闭式真值）
        run: npm run parity
      - name: 内核语义/审计断言（§四 空洞 + #12/#14/#9）
        run: npm run audit
      - name: UI 数据层断言（剧本库 / 备份 / 参数表 · M9/M10/M12）
        run: npm run uidata
      - name: 主线程重算开销巡检（灾难级预算 · M15）
        run: npm run perf
      - name: Production build
        run: npm run build
      - name: 产物体积报告
        run: |
          echo "== dist 总计 =="
          du -sh dist
          echo "== 最大 5 个 JS 分片 =="
          find dist -name '*.js' -printf '%s\t%p\n' | sort -nr | head -5 | awk '{printf "%.1f KB\t%s\n", $1/1024, $2}'
      - name: 部署件自检（_headers 已随构建进入 dist）
        run: test -f dist/_headers && echo "dist/_headers 就位"

  e2e:
    name: v2 · Playwright 冒烟（13 工具 × 双主题 + 关键交互）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - name: Install（锁定版本）
        run: npm ci
      - name: 安装 Playwright Chromium（含系统依赖）
        run: npx playwright install --with-deps chromium
      - name: E2E（加载 0 console error + 5 条关键交互）
        run: npm run e2e
      - name: 上传失败证据（trace / 截图 / 与基线的差异图 / HTML 报告）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: |
            v2/test-results/
            v2/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
